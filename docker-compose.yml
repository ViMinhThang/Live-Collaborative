services:
  backend-app:
    image: ghcr.io/viminhthang/live-collaborative-backend:latest
    ports:
      - "80:8080"
    environment:
      - DATABASE_URL=postgres://testuser:testpass@db:5432/testdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
  frontend-app:
    image: ghcr.io/viminhthang/live-collaborative-frontend:latest
    ports:
      - "5000:80"
    depends_on:
      - backend-app
    networks:
      - app-network
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=testdb
    healthcheck:
      test: ["CMD","pg_isready","-U","testuser","-d","testdb"]
      interval: 10s
      retries: 5
    networks:
       - app-network
    volumes:
                                                                                                                                   16,13         Top

